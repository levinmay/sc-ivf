[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-ivf"
version = "1.1.0"
description = "Stage-conditional synthesis of linked IVF records"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "pandas==2.3.3", "scipy==1.16.3", "scikit-learn==1.7.2", "joblib==1.5.2", "threadpoolctl==3.6.0", "sdv==1.38.2", "pyarrow==25.0.1"]

[tool.setuptools]
packages = ["shared_ivf"]

